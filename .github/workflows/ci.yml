name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.27 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Reproduce embedded decoder
        run: |
          sh scripts/setup-wasi-sdk.sh "$RUNNER_TEMP/wasi-sdk"
          WASI_SDK_PATH="$RUNNER_TEMP/wasi-sdk/wasi-sdk-34.0-x86_64-linux" sh scripts/build-decoder.sh
          git diff --exit-code -- internal/video/decoder.wasm

      - name: Scan embedded decoder dependencies
        run: python3 scripts/decoder-metadata.py .cache/decoder.sbom.json

      - name: Scan C codec SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: .cache/decoder.sbom.json
          fail-build: true
          severity-cutoff: low

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  cross-build:
    name: Single-file ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build without external codec or CGo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/jetkvm" ./cmd/jetkvm
