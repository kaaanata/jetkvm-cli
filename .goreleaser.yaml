version: 2

project_name: jetkvm

before:
  hooks:
    - ./scripts/render-installers.sh {{ .Tag }} .cache/release-installers

builds:
  - id: jetkvm
    main: ./cmd/jetkvm
    binary: jetkvm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/kaaanata/jetkvm-cli/internal/buildinfo.version={{ .Version }}
        -X github.com/kaaanata/jetkvm-cli/internal/buildinfo.commit={{ .Commit }}
        -X github.com/kaaanata/jetkvm-cli/internal/buildinfo.date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - jetkvm
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .cache/release-installers/install.sh
      name_template: install.sh
    - glob: .cache/release-installers/install.ps1
      name_template: install.ps1

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - id: archives
    artifacts: archive

changelog:
  disable: true

release:
  mode: keep-existing
  extra_files:
    - glob: .cache/release-installers/install.sh
      name_template: install.sh
    - glob: .cache/release-installers/install.ps1
      name_template: install.ps1

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
